name: Release

# Builds both product brands (AART and NSR) from this one source tree and
# attaches both as distinctly-named binaries on a single GitHub Release,
# triggered by pushing any tag. See BRAND in the top-level CMakeLists.txt
# for what differs between brands.
on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write

env:
  IDF_IMAGE: espressif/idf:v5.3.1

jobs:
  build:
    strategy:
      matrix:
        include:
          - brand: aart
            asset_name: AART-Remora-Programmer
          - brand: nsr
            asset_name: NSR-Programmer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ${{ matrix.brand }} firmware
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v ${{ github.workspace }}:/project -w /project "$IDF_IMAGE" \
            bash -c "idf.py -D BRAND=${{ matrix.brand }} set-target esp32s2 && idf.py build"

      - name: Merge into a single flashable image
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v ${{ github.workspace }}:/project -w /project "$IDF_IMAGE" \
            bash -c "cd build && python -m esptool --chip esp32s2 merge_bin -o merged.bin @flash_args"

      - name: Name release asset
        id: asset
        run: |
          NAME="${{ matrix.asset_name }}-${{ github.ref_name }}-ESP32-S2.bin"
          mv build/merged.bin "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.brand }}-binary
          path: ${{ steps.asset.outputs.name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download built binaries
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*/*.bin
          generate_release_notes: true
